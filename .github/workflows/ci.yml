name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_orders_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        poetry install --no-interaction
    
    - name: Run linter (flake8)
      run: |
        poetry add --group dev flake8
        poetry run flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=120
    
    - name: Run type checker (mypy)
      continue-on-error: true
      run: |
        poetry add --group dev mypy
        poetry run mypy app/ --ignore-missing-imports
    
    - name: Run database migrations
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_orders_db
      run: |
        poetry run alembic upgrade head
    
    - name: Run tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_orders_db
      run: |
        poetry add --group dev pytest pytest-cov httpx
        poetry run pytest tests/ -v --cov=app --cov-report=xml --cov-report=term
    
    - name: Security audit
      run: |
        poetry add --group dev pip-audit
        poetry run pip-audit

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker-compose build
    
    - name: Test Docker services
      run: |
        docker-compose up -d
        sleep 10
        docker-compose ps
        curl -f http://localhost:8000/docs || exit 1
        docker-compose down